const SIP = {
  satinalma: {
    kisa: 'sa', ad: 'Satın Alma', cogul: 'Satın Almalar', firmaVarlik: 'tedarikciler', firmaEt: 'Tedarikçi',
    durumlar: ['Taslak', 'Sipariş Verildi', 'Yolda', 'Teslim Alındı', 'İptal'], tamam: 'Teslim Alındı', varsayilan: 'Sipariş Verildi'
  },
  musteriSiparis: {
    kisa: 'ms', ad: 'Müşteri Siparişi', cogul: 'Müşteri Siparişleri', firmaVarlik: 'musteriler', firmaEt: 'Müşteri',
    durumlar: ['Alındı', 'Hazırlanıyor', 'Sevk Edildi', 'Teslim Edildi', 'İptal'], tamam: 'Teslim Edildi', varsayilan: 'Alındı'
  }
};
const KISA_TUR = { sa: 'satinalma', ms: 'musteriSiparis' };
const PARA = { TRY: 'TL', EUR: 'EUR', USD: 'USD' };
const BIRIMLER = ['adet', 'kg', 'm', 'm²', 'lt', 'set', 'paket', 'saat', 'gün'];
const SP = { tur: 'satinalma', arama: '', filtre: 'acik' };
let SF = null;
let FIRMALAR = null;

const para = (n, pb) => Number(n || 0).toLocaleString('tr-TR', { style: 'currency', currency: pb || 'TRY' });
const tarihKisa = s => s ? String(s).slice(0, 10).split('-').reverse().join('.') : '';
const sayiGoster = n => Number(n).toLocaleString('tr-TR', { maximumFractionDigits: 3 });
const bugun = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
/** Türkçe sayı okuma: "1.250,50" → 1250.5, "42.000" → 42000, "2,5" → 2.5, "2.5" → 2.5 */
function sayiOku(s) {
  s = String(s ?? '').trim().replace(/\s/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); // nokta binlik ayırıcı
  return Number(s);
}
const sayiYaz = n => (n === '' || n == null || isNaN(n)) ? '' : String(n).replace('.', ',');
const kalemOzet = x => {
  const k = x.Kalemler || [];
  if (!k.length) return '';
  return k[0].aciklama + (k.length > 1 ? ` ve ${k.length - 1} kalem daha` : '');
};
const siraNo = no => parseInt(String(no).split('-').pop(), 10) || 0; // LCS261001-12 → 12
const siparisAcik = (t, s) => s.Durum !== SIP[t].tamam && s.Durum !== 'İptal';
const durumSinif = (t, d) => d === SIP[t].tamam ? 'ok' : d === 'İptal' ? 'pasif' : d === 'Taslak' ? 'uyari' : '';
function firmaAdi(t, s) {
  const f = ((FIRMALAR && FIRMALAR[SIP[t].firmaVarlik]) || []).find(x => x.Id === s.FirmaId);
  return f ? f.Ad : (s.FirmaAd || '—');
}
async function firmalarYukle() {
  const r = await api('firma.secim');
  FIRMALAR = r; ls.koy('locus_c_firmalar', r);
  return r;
}

SAYFA_CIZ.siparisler = function (ic, s, y) {
  if (D.param) return siparisDetay(ic, s, y, D.param);
  const t = SP.tur, c = SIP[t];
  ic.innerHTML = sayfaBasHTML(s, y, y === 'tam' ? `<button class="btn" type="button" onclick="siparisForm('${t}')">+ Yeni ${c.ad}</button>` : '') + `
    <div class="sekmeler" role="tablist">${Object.keys(SIP).map(k =>
      `<button type="button" role="tab" class="${k === t ? 'on' : ''}" onclick="SP.tur='${k}';rotaUygula()">${SIP[k].cogul}</button>`).join('')}</div>
    <div class="arac">
      <label class="arama"><span>🔍</span><input id="sAra" type="search" autocomplete="off"
        placeholder="${t === 'musteriSiparis' ? 'Sipariş no, müşteri veya müşteri PO no ara' : 'Sipariş no veya tedarikçi ara'}"
        value="${esc(SP.arama)}" oninput="SP.arama=this.value;siparisListeCiz()"></label>
      <div class="cips">${[['acik', 'Açık'], ['tamam', 'Tamamlanan'], ['iptal', 'İptal'], ['tumu', 'Tümü']].map(([k, a]) =>
        `<button type="button" data-f="${k}" onclick="SP.filtre='${k}';siparisListeCiz()">${a}</button>`).join('')}</div>
    </div>
    <div class="ozet" id="sOzet"></div>
    <div class="kart" id="sListe"></div>`;

  if (!FIRMALAR) FIRMALAR = ls.al('locus_c_firmalar');
  const ob = VERI[t] || ls.al('locus_c_' + t);
  if (ob) { VERI[t] = ob; siparisListeCiz(); }
  else $('sListe').innerHTML = '<div class="bos"><p>Siparişler yükleniyor…</p></div>';
  Promise.all([veriYukle(t), firmalarYukle()])
    .then(() => { if (D.aktif === 'siparisler' && !D.param && SP.tur === t) siparisListeCiz(); })
    .catch(e => { if (!ob && $('sListe')) $('sListe').innerHTML = `<div class="bos"><h3>Liste alınamadı</h3><p>${esc(e.message)}</p></div>`; });
};

function siparisListeCiz() {
  const kutu = $('sListe'); if (!kutu) return;
  const t = SP.tur, c = SIP[t], tam = yetki('siparisler') === 'tam';
  document.querySelectorAll('.cips [data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === SP.filtre));
  const tum = VERI[t] || [];
  const q = trKucuk(SP.arama);
  const l = tum
    .filter(s => SP.filtre === 'tumu' || (SP.filtre === 'acik' && siparisAcik(t, s)) ||
      (SP.filtre === 'tamam' && s.Durum === c.tamam) || (SP.filtre === 'iptal' && s.Durum === 'İptal'))
    .filter(s => !q || [s.No, firmaAdi(t, s), s.MusteriSiparisNo].some(x => trKucuk(x).includes(q)))
    .sort((a, b) => String(b.Tarih).localeCompare(String(a.Tarih)) || siraNo(b.No) - siraNo(a.No));

  // Para birimi başına ayrı toplam (iptaller hariç)
  const top = {};
  l.filter(s => s.Durum !== 'İptal').forEach(s => top[s.ParaBirimi] = (top[s.ParaBirimi] || 0) + Number(s.Toplam));
  $('sOzet').innerHTML = `<span class="soluk">${l.length} sipariş</span>` +
    Object.keys(PARA).filter(p => top[p]).map(p => `<span class="ozet-tutar">${para(top[p], p)}</span>`).join('');

  if (!tum.length) {
    kutu.innerHTML = `<div class="bos"><div class="b-ikon">🛒</div><h3>Henüz ${c.ad.toLocaleLowerCase('tr-TR')} kaydı yok</h3>
      <p>${tam ? `İlk kaydı eklemek için Yeni ${c.ad}'ya dokunun.` : 'Kayıt eklendiğinde burada listelenecek.'}</p></div>`;
    return;
  }
  if (!l.length) {
    kutu.innerHTML = `<div class="bos"><h3>Sonuç yok</h3><p>${q ? `"${esc(SP.arama.trim())}" ile eşleşen sipariş bulunamadı.` : 'Bu filtrede sipariş yok.'}</p></div>`;
    return;
  }
  const bgn = bugun();
  kutu.innerHTML = l.map(s => {
    const gec = siparisAcik(t, s) && s.TeslimTarihi && s.TeslimTarihi < bgn;
    const n = (s.Kalemler || []).length;
    const rota = `siparisler/${c.kisa}.${s.Id}`;
    return `<div class="m-satir s-satir" onclick="git('${rota}')">
      <span class="s-no"><b>${esc(s.No)}</b><small>${tarihKisa(s.Tarih)}</small></span>
      <span class="ms-ic"><span class="ms-ad">${esc(firmaAdi(t, s))}</span>
        <span class="ms-alt">${n} kalem${s.MusteriSiparisNo ? ', PO ' + esc(s.MusteriSiparisNo) : ''}${s.TeslimTarihi ? ', teslim ' + tarihKisa(s.TeslimTarihi) : ''}${gec ? ' <span class="gecikti">Gecikti</span>' : ''}</span></span>
      <span class="s-tutar">${para(s.Toplam, s.ParaBirimi)}</span>
      <span class="rozet ${durumSinif(t, s.Durum)}">${esc(s.Durum)}</span>
      <span class="m-btn">
        <button class="btn ikincil kucuk" type="button" onclick="event.stopPropagation();git('${rota}')">Görüntüle</button>
        ${tam ? `<button class="btn ikincil kucuk" type="button" onclick="event.stopPropagation();siparisForm('${t}','${s.Id}')">Düzenle</button>` : ''}
      </span></div>`;
  }).join('');
}

// ---------- Sipariş görüntüleme ----------
function siparisDetay(ic, s, y, param) {
  const t = KISA_TUR[param.slice(0, 2)], id = param.slice(3);
  const geri = `<button class="geri" type="button" onclick="SP.tur='${t || 'satinalma'}';git('siparisler')">‹ Siparişler</button>`;
  if (!t) { ic.innerHTML = geri + '<div class="kart bos"><h3>Sipariş bulunamadı</h3></div>'; return; }
  const c = SIP[t];

  const ciz = () => {
    const x = (VERI[t] || []).find(k => k.Id === id);
    if (!x) { ic.innerHTML = geri + '<div class="kart bos"><div class="b-ikon">🔍</div><h3>Sipariş bulunamadı</h3><p>Silinmiş olabilir.</p></div>'; return; }
    const tam = y === 'tam';
    const gec = siparisAcik(t, x) && x.TeslimTarihi && x.TeslimTarihi < bugun();
    const firmaHTML = yetki(c.firmaVarlik) !== 'yok'
      ? `<a class="firma-link" onclick="git('${c.firmaVarlik}/${x.FirmaId}')">${esc(firmaAdi(t, x))}</a>` : esc(firmaAdi(t, x));
    const durumHTML = tam
      ? `<select class="girdi durum-sec" onchange="siparisDurumDegistir('${t}','${x.Id}',this.value)">${c.durumlar.map(d => `<option ${d === x.Durum ? 'selected' : ''}>${d}</option>`).join('')}</select>`
      : esc(x.Durum);

    ic.innerHTML = geri + `
      <div class="d-bas">
        <span class="av buyuk">${c.kisa.toUpperCase()}</span>
        <div class="d-bas-ic"><h2>${esc(x.No)}</h2>
          <div class="d-rozetler"><span class="rozet">${c.ad}</span><span class="rozet ${durumSinif(t, x.Durum)}">${esc(x.Durum)}</span>
          ${gec ? '<span class="rozet" style="color:var(--danger)">Teslim gecikti</span>' : ''}
          ${y === 'goruntule' ? '<span class="rozet uyari">👁 Sadece görüntüleme</span>' : ''}</div></div>
        ${tam || stokIslenebilir(t, x.Durum) ? `<div class="d-bas-sag">
          ${yetki('stok') === 'tam' && stokIslenebilir(t, x.Durum) ? (VERI.stokHareket || []).some(hh => hh.SiparisId === x.Id)
            ? `<button class="btn ikincil" type="button" onclick="stokIsleModal('${t}','${x.Id}')">📦 Stoka işlendi</button>`
            : `<button class="btn ikincil" type="button" onclick="stokIsleModal('${t}','${x.Id}')">📦 Stoka İşle</button>` : ''}
          ${tam ? `<button class="btn ikincil" type="button" style="color:var(--danger)" onclick="siparisSilOnay('${t}','${x.Id}')">Sil</button>
          <button class="btn" type="button" onclick="siparisForm('${t}','${x.Id}')">Düzenle</button>` : ''}</div>` : ''}
      </div>

      <section class="kart panel">
        <h3 class="panel-bas">Sipariş Bilgileri</h3>
        <div class="bilgi-grid">
          <div><div class="de">${c.firmaEt}</div>${firmaHTML}</div>
          <div><div class="de">Sipariş tarihi</div>${tarihKisa(x.Tarih)}</div>
          <div><div class="de">Teslim tarihi</div>${x.TeslimTarihi ? tarihKisa(x.TeslimTarihi) : '<span class="soluk">Belirtilmemiş</span>'}</div>
          <div><div class="de">Durum</div>${durumHTML}</div>
          <div><div class="de">Para birimi</div>${PARA[x.ParaBirimi] || esc(x.ParaBirimi)}</div>
          <div><div class="de">KDV</div>%${x.KdvOrani}</div>
          ${t === 'musteriSiparis' ? `<div><div class="de">Müşteri sipariş no</div>${x.MusteriSiparisNo ? esc(x.MusteriSiparisNo) : '<span class="soluk">Yok</span>'}</div>` : ''}
        </div>

        <h4 class="panel-alt">Kalemler</h4>
        <div class="tablo-kap"><table class="tablo">
          <thead><tr><th style="width:36px">#</th><th>Açıklama</th><th class="sag">Miktar</th><th class="sag">Birim fiyat</th><th class="sag">Tutar</th></tr></thead>
          <tbody>${(x.Kalemler || []).map((k, i) => `<tr><td class="soluk">${i + 1}</td><td>${esc(k.aciklama)}</td>
            <td class="sag">${sayiGoster(k.miktar)} ${esc(k.birim)}</td><td class="sag">${para(k.birimFiyat, x.ParaBirimi)}</td>
            <td class="sag">${para(k.tutar, x.ParaBirimi)}</td></tr>`).join('')}</tbody>
        </table></div>
        <div class="toplamlar">
          <div><span>Ara toplam</span><span>${para(x.AraToplam, x.ParaBirimi)}</span></div>
          <div><span>KDV (%${x.KdvOrani})</span><span>${para(x.Kdv, x.ParaBirimi)}</span></div>
          <div class="genel"><span>Genel toplam</span><span>${para(x.Toplam, x.ParaBirimi)}</span></div>
        </div>

        <h4 class="panel-alt">Notlar</h4>
        ${x.Notlar ? `<div class="d-not">${esc(x.Notlar)}</div>` : '<p class="soluk">Not yok.</p>'}
        <div class="d-meta" style="margin-top:16px">Oluşturan: @${esc(x.Olusturan || '?')}, ${esc(tarihYaz(x.Olusturma))}. Son güncelleme: @${esc(x.Guncelleyen || '?')}, ${esc(tarihYaz(x.Guncelleme))}</div>
      </section>`;
  };

  if (!FIRMALAR) FIRMALAR = ls.al('locus_c_firmalar');
  const ob = VERI[t] || ls.al('locus_c_' + t);
  if (ob) { VERI[t] = ob; ciz(); } else ic.innerHTML = '<div class="kart bos"><p>Yükleniyor…</p></div>';
  if (yetki('stok') !== 'yok' && !VERI.stokHareket) VERI.stokHareket = ls.al('locus_c_stokHareket') || undefined;
  Promise.all([veriYukle(t), firmalarYukle(), ...(yetki('stok') !== 'yok' ? [veriYukle('stokHareket').catch(() => null)] : [])])
    .then(() => { if (D.aktif === 'siparisler' && D.param === param && $('modal').hidden) ciz(); })
    .catch(e => { if (!ob) ic.innerHTML = geri + `<div class="kart bos"><h3>Sipariş alınamadı</h3><p>${esc(e.message)}</p></div>`; });
}

async function siparisDurumDegistir(t, id, durum) {
  const x = (VERI[t] || []).find(k => k.Id === id); if (!x) return;
  const onceki = x.Durum;
  let tamam = false;
  try {
    const r = await api('kayit.kaydet', { varlik: t, kayit: Object.assign({}, x, { Durum: durum }) });
    veriGuncelle(t, r);
    toast(`${r.No}: ${durum}`);
    tamam = true;
  } catch (e) { toast(e.message, true); }
  rotaUygula();
  if (tamam && yetki('stok') === 'tam' && stokIslenebilir(t, durum) && !stokIslenebilir(t, onceki)) stokIsleModal(t, id);
}

// ---------- Ekle / Düzenle ----------
function siparisForm(t, id) {
  const c = SIP[t];
  const x = id ? (VERI[t] || []).find(k => k.Id === id) : null;
  if (!FIRMALAR) { toast('Firma listesi yükleniyor, birazdan tekrar deneyin.'); firmalarYukle().catch(() => {}); return; }
  const firmalar = (FIRMALAR[c.firmaVarlik] || []).filter(f => f.Aktif || (x && f.Id === x.FirmaId)).sort((a, b) => trSirala(a.Ad, b.Ad));

  if (!firmalar.length) {
    const fk = FIRMA[c.firmaVarlik];
    modalAc(`Yeni ${c.ad}`, `<p>Sipariş girebilmek için önce en az bir aktif ${fk.kucuk} kaydı olmalı.</p>`,
      `<button class="btn ikincil" type="button" onclick="modalKapat()">Kapat</button>
       ${yetki(c.firmaVarlik) === 'tam' ? `<button class="btn" type="button" onclick="git('${c.firmaVarlik}')">${fk.tekil} Ekle</button>` : ''}`);
    return;
  }

  SF = {
    tur: t, Id: x ? x.Id : null, pb: x ? x.ParaBirimi : 'TRY',
    kalemler: x ? x.Kalemler.map(k => ({ aciklama: k.aciklama, miktar: sayiYaz(k.miktar), birim: k.birim, birimFiyat: sayiYaz(k.birimFiyat) }))
      : [{ aciklama: '', miktar: '1', birim: 'adet', birimFiyat: '' }]
  };
  modalAc(x ? `${x.No} Düzenle` : `Yeni ${c.ad}`, `
    <div class="iki">
      <div><label class="et" for="sfFirma">${c.firmaEt} *</label>
        <select class="girdi" id="sfFirma"><option value="">Seçin…</option>${firmalar.map(f =>
          `<option value="${f.Id}" ${x && x.FirmaId === f.Id ? 'selected' : ''}>${esc(f.Ad)}${f.Aktif ? '' : ' (pasif)'}</option>`).join('')}</select></div>
      <div><label class="et" for="sfDurum">Durum</label>
        <select class="girdi" id="sfDurum">${c.durumlar.map(d => `<option ${d === (x ? x.Durum : c.varsayilan) ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
      <div><label class="et" for="sfTarih">Sipariş tarihi *</label>
        <input class="girdi" type="date" id="sfTarih" value="${x ? x.Tarih : bugun()}"></div>
      <div><label class="et" for="sfTeslim">Teslim tarihi</label>
        <input class="girdi" type="date" id="sfTeslim" value="${x ? x.TeslimTarihi || '' : ''}"></div>
      <div><label class="et">Para birimi</label>
        <div class="cips" style="width:100%;margin-bottom:18px">${Object.keys(PARA).map(p =>
          `<button type="button" data-pb="${p}" style="flex:1" onclick="pbSec('${p}')">${PARA[p]}</button>`).join('')}</div></div>
      <div><label class="et" for="sfKdv">KDV oranı</label>
        <select class="girdi" id="sfKdv" onchange="toplamHesapla()">${[20, 10, 1, 0].map(o =>
          `<option value="${o}" ${(x ? x.KdvOrani : 20) === o ? 'selected' : ''}>%${o}</option>`).join('')}</select></div>
    </div>
    ${t === 'musteriSiparis' ? `<label class="et" for="sfPo">Müşterinin sipariş no'su</label>
      <input class="girdi" id="sfPo" value="${x ? esc(x.MusteriSiparisNo) : ''}" placeholder="Müşterinin kendi PO numarası (varsa)">` : ''}
    <div class="bolum-et">Kalemler<button class="btn ikincil kucuk" type="button" onclick="kalemEkle()">+ Kalem Ekle</button></div>
    <div class="kalem-bas"><span>Ürün / hizmet</span><span>Miktar</span><span>Birim</span><span>Birim fiyat</span><span style="text-align:right">Tutar</span><span></span></div>
    <div id="sfKalemler"></div>
    <div class="toplamlar" id="sfToplam"></div>
    <label class="et" for="sfNot">Notlar</label>
    <textarea class="girdi alan" id="sfNot" placeholder="Siparişle ilgili notlar">${x ? esc(x.Notlar) : ''}</textarea>
    <div class="hata-kutu" id="mHata"></div>`,
    `<button class="btn ikincil" type="button" onclick="modalKapat()">Vazgeç</button>
     <button class="btn" type="button" id="sfKaydet" onclick="siparisKaydet()">Kaydet</button>`, true);
  pbSec(SF.pb);
  kalemlerCiz();
}

function pbSec(pb) {
  SF.pb = pb;
  document.querySelectorAll('[data-pb]').forEach(b => b.classList.toggle('on', b.dataset.pb === pb));
  toplamHesapla();
}

function kalemlerCiz() {
  $('sfKalemler').innerHTML = SF.kalemler.map((k, i) => `
    <div class="kalem">
      <input class="girdi k-ac" placeholder="Ürün / hizmet açıklaması" value="${esc(k.aciklama)}" oninput="SF.kalemler[${i}].aciklama=this.value">
      <input class="girdi" inputmode="decimal" placeholder="Miktar" value="${esc(k.miktar)}" oninput="SF.kalemler[${i}].miktar=this.value;toplamHesapla()">
      <select class="girdi" onchange="SF.kalemler[${i}].birim=this.value">${[...new Set([...BIRIMLER, k.birim || 'adet'])].map(b =>
        `<option ${b === (k.birim || 'adet') ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>
      <input class="girdi" inputmode="decimal" placeholder="Birim fiyat" value="${esc(k.birimFiyat)}" oninput="SF.kalemler[${i}].birimFiyat=this.value;toplamHesapla()">
      <span class="k-tutar" id="kt${i}"></span>
      <button class="k-sil" type="button" onclick="kalemKaldir(${i})" aria-label="Kalemi kaldır" ${SF.kalemler.length === 1 ? 'disabled' : ''}>×</button>
    </div>`).join('');
  toplamHesapla();
}
function kalemEkle() { SF.kalemler.push({ aciklama: '', miktar: '1', birim: 'adet', birimFiyat: '' }); kalemlerCiz(); }
function kalemKaldir(i) { if (SF.kalemler.length > 1) { SF.kalemler.splice(i, 1); kalemlerCiz(); } }

function toplamHesapla() {
  if (!$('sfToplam')) return;
  const yuv = n => Math.round((n + Number.EPSILON) * 100) / 100;
  let ara = 0;
  SF.kalemler.forEach((k, i) => {
    const m = sayiOku(k.miktar), f = sayiOku(k.birimFiyat);
    const ok = m > 0 && f >= 0;
    const tutar = ok ? yuv(m * f) : 0;
    ara += tutar;
    if ($('kt' + i)) $('kt' + i).textContent = ok ? para(tutar, SF.pb) : '—';
  });
  ara = yuv(ara);
  const oran = Number($('sfKdv').value), kdv = yuv(ara * oran / 100);
  $('sfToplam').innerHTML = `
    <div><span>Ara toplam</span><span>${para(ara, SF.pb)}</span></div>
    <div><span>KDV (%${oran})</span><span>${para(kdv, SF.pb)}</span></div>
    <div class="genel"><span>Genel toplam</span><span>${para(yuv(ara + kdv), SF.pb)}</span></div>`;
}

async function siparisKaydet() {
  const t = SF.tur, c = SIP[t];
  const hata = m => ($('mHata').textContent = m);
  const kalemler = SF.kalemler
    .filter(k => k.aciklama.trim() || String(k.birimFiyat).trim())
    .map(k => ({ aciklama: k.aciklama.trim(), miktar: sayiOku(k.miktar), birim: k.birim || 'adet', birimFiyat: sayiOku(k.birimFiyat) }));
  const kayit = {
    Id: SF.Id, FirmaId: $('sfFirma').value, Durum: $('sfDurum').value,
    Tarih: $('sfTarih').value, TeslimTarihi: $('sfTeslim').value,
    ParaBirimi: SF.pb, KdvOrani: Number($('sfKdv').value),
    MusteriSiparisNo: $('sfPo') ? $('sfPo').value.trim() : undefined,
    Kalemler: kalemler, Notlar: $('sfNot').value.trim()
  };
  if (!kayit.FirmaId) return hata(`${c.firmaEt} seçin.`);
  if (!kayit.Tarih) return hata('Sipariş tarihi gerekli.');
  if (!kalemler.length) return hata('En az bir kalem girin.');
  for (let i = 0; i < kalemler.length; i++) {
    const k = kalemler[i];
    if (!k.aciklama) return hata(`${i + 1}. kalemin açıklaması boş.`);
    if (!(k.miktar > 0)) return hata(`${i + 1}. kalemde miktar geçersiz.`);
    if (!(k.birimFiyat >= 0)) return hata(`${i + 1}. kalemde birim fiyat geçersiz. Örnek: 1250,50`);
  }

  const btn = $('sfKaydet'); btn.disabled = true; btn.textContent = 'Kaydediliyor…';
  try {
    const onceki = kayit.Id ? ((VERI[t] || []).find(k => k.Id === kayit.Id) || {}).Durum : null;
    const r = await api('kayit.kaydet', { varlik: t, kayit });
    veriGuncelle(t, r);
    modalKapat();
    if (D.aktif === 'siparisler' && D.param) rotaUygula(); else siparisListeCiz();
    toast(`${r.No} ${kayit.Id ? 'güncellendi' : 'oluşturuldu'}.`);
    if (yetki('stok') === 'tam' && stokIslenebilir(t, r.Durum) && !stokIslenebilir(t, onceki)) stokIsleModal(t, r.Id);
  } catch (e) {
    hata(e.message); btn.disabled = false; btn.textContent = 'Kaydet';
  }
}

function siparisSilOnay(t, id) {
  const x = (VERI[t] || []).find(k => k.Id === id);
  modalAc('Siparişi Sil', `<p><b>${esc(x.No)}</b> (${esc(firmaAdi(t, x))}, ${para(x.Toplam, x.ParaBirimi)}) kalıcı olarak silinecek.</p>
    <p style="color:var(--mute);margin-top:10px;font-size:14px">Gerçekleşmeyen bir siparişse silmek yerine durumunu İptal yapmanız geçmiş kayıtlar için daha iyi olur.</p>
    <div class="hata-kutu" id="mHata"></div>`,
    `<button class="btn ikincil" type="button" onclick="modalKapat()">Vazgeç</button>
     <button class="btn tehlike" type="button" id="mSil" onclick="siparisSil('${t}','${id}')">Sil</button>`);
}

async function siparisSil(t, id) {
  const btn = $('mSil'); btn.disabled = true; btn.textContent = 'Siliniyor…';
  try {
    await api('kayit.sil', { varlik: t, id });
    veriCikar(t, id);
    modalKapat(); toast('Sipariş silindi.');
    SP.tur = t; git('siparisler');
  } catch (e) {
    $('mHata').textContent = e.message; btn.disabled = false; btn.textContent = 'Sil';
  }
}


// ==================== STOK ====================
// Güncel miktar elle girilmez; hareketlerin toplamından hesaplanır.
const STK = { sekme: 'durum', arama: '', kat: '', filtre: 'tumu', hArama: '', hTur: 'tumu' };
const HAREKET_SINIF = { 'Açılış': '', 'Giriş': 'ok', 'Çıkış': 'tehlike', 'Sayım': 'uyari' };
let HF = null; // açık hareket formu
let SI = null; // siparişi stoka işleme
const miktarYaz = n => Number(n || 0).toLocaleString('tr-TR', { maximumFractionDigits: 3 });
const malzemeBul = id => (VERI.stokMalzeme || []).find(m => m.Id === id);
const katAdi = id => ((VERI.stokKategori || []).find(c => c.Id === id) || {}).Ad || 'Kategorisiz';
const hareketEtki = h => h.Tur === 'Çıkış' ? -Number(h.Miktar) : Number(h.Miktar);
function stokHaritasi() {
  const m = {};
  (VERI.stokHareket || []).forEach(h => m[h.MalzemeId] = Math.round(((m[h.MalzemeId] || 0) + hareketEtki(h)) * 1000) / 1000);
  return m;
}
const kritikMi = (m, stok) => m.KritikSeviye > 0 && (stok[m.Id] || 0) <= m.KritikSeviye;
const hareketSirala = (a, b) => String(b.Tarih).localeCompare(String(a.Tarih)) || String(b.Olusturma).localeCompare(String(a.Olusturma));

function stokOnbellek() {
  let hazir = true;
  ['stokMalzeme', 'stokKategori', 'stokHareket'].forEach(v => {
    if (!VERI[v]) VERI[v] = ls.al('locus_c_' + v) || undefined;
    if (!VERI[v]) hazir = false;
  });
  if (!FIRMALAR) FIRMALAR = ls.al('locus_c_firmalar');
  return hazir;
}
function stokVeriYukle() {
  return Promise.all([veriYukle('stokMalzeme'), veriYukle('stokKategori'), veriYukle('stokHareket'), firmalarYukle().catch(() => null)]);
}

SAYFA_CIZ.stok = function (ic, s, y) {
  if (D.param) return malzemeDetay(ic, s, y, D.param);
  const tam = y === 'tam';
  ic.innerHTML = sayfaBasHTML(s, y, tam ? `<button class="btn ikincil" type="button" onclick="hareketForm('Çıkış')">− Çıkış</button>
      <button class="btn" type="button" onclick="hareketForm('Giriş')">+ Giriş</button>` : '') + `
    <div class="sekmeler" role="tablist">${[['durum', 'Stok Durumu'], ['hareketler', 'Hareketler'], ['tanimlar', '<span class="uzun">Malzemeler ve Kategoriler</span><span class="kisa">Tanımlar</span>']].map(([k, a]) =>
      `<button type="button" role="tab" class="${STK.sekme === k ? 'on' : ''}" onclick="STK.sekme='${k}';rotaUygula()">${a}</button>`).join('')}</div>
    <div id="stokIcerik"></div>`;
  const hazir = stokOnbellek();
  if (hazir) stokSekmeCiz(); else $('stokIcerik').innerHTML = '<div class="kart bos"><p>Stok yükleniyor…</p></div>';
  stokVeriYukle()
    .then(() => { if (D.aktif === 'stok' && !D.param && $('modal').hidden) { hazir ? stokListeYenile() : stokSekmeCiz(); } })
    .catch(e => { if (!hazir && $('stokIcerik')) $('stokIcerik').innerHTML = `<div class="kart bos"><h3>Stok alınamadı</h3><p>${esc(e.message)}</p></div>`; });
};

function stokSekmeCiz() {
  const ic = $('stokIcerik'); if (!ic) return;
  const tam = yetki('stok') === 'tam';
  const katSec = (id, deger, bos) => `<select class="girdi sec" id="${id}" onchange="STK.kat=this.value;stokListeYenile()">
      <option value="">${bos}</option>${(VERI.stokKategori || []).slice().sort((a, b) => trSirala(a.Ad, b.Ad)).map(c =>
      `<option value="${c.Id}" ${deger === c.Id ? 'selected' : ''}>${esc(c.Ad)}</option>`).join('')}</select>`;

  if (STK.sekme === 'durum') {
    ic.innerHTML = `
      <div class="arac">
        <label class="arama"><span>🔍</span><input type="search" autocomplete="off" placeholder="Malzeme ara" value="${esc(STK.arama)}" oninput="STK.arama=this.value;stokListeYenile()"></label>
        ${katSec('stkKat', STK.kat, 'Tüm kategoriler')}
        <div class="cips">${[['tumu', 'Tümü'], ['kritik', 'Kritik']].map(([k, a]) =>
          `<button type="button" data-f="${k}" onclick="STK.filtre='${k}';stokListeYenile()">${a}</button>`).join('')}</div>
      </div>
      <div class="arac-alt">
        <span class="sayac" id="stkSayac"></span>
        <span class="arac-sag">
          ${tam ? `<button class="btn ikincil kucuk" type="button" onclick="hareketForm('Sayım')">⚖️ Sayım Gir</button>` : ''}
          <button class="btn ikincil kucuk" type="button" onclick="stokExcel()">⬇ Excel</button>
          <button class="btn ikincil kucuk" type="button" onclick="sayimListesiModal()">🖨 Sayım Listesi</button>
        </span>
      </div>
      <div class="kart" id="stkListe"></div>`;
  } else if (STK.sekme === 'hareketler') {
    ic.innerHTML = `
      <div class="arac">
        <label class="arama"><span>🔍</span><input type="search" autocomplete="off" placeholder="Malzeme, firma, sipariş no ara" value="${esc(STK.hArama)}" oninput="STK.hArama=this.value;stokListeYenile()"></label>
        <div class="cips">${[['tumu', 'Tümü'], ['giris', 'Giriş'], ['cikis', 'Çıkış'], ['sayim', 'Sayım']].map(([k, a]) =>
          `<button type="button" data-f="${k}" onclick="STK.hTur='${k}';stokListeYenile()">${a}</button>`).join('')}</div>
      </div>
      <div class="sayac" id="stkSayac"></div>
      <div class="kart" id="stkListe"></div>`;
  } else {
    ic.innerHTML = `<div class="ikili">
      <section class="kart panel"><div class="w-bas"><h3>Malzemeler</h3><span class="soluk" id="mlzSayac"></span>
        ${tam ? `<button class="btn kucuk sag" type="button" onclick="malzemeForm()">+ Malzeme Ekle</button>` : ''}</div>
        <div id="mlzListe"></div></section>
      <section class="kart panel"><div class="w-bas"><h3>Kategoriler</h3></div>
        <div id="katListe"></div>
        ${tam ? `<div class="kat-ekle"><input class="girdi" id="katYeni" placeholder="Yeni kategori adı" onkeydown="if(event.key==='Enter')kategoriEkle()">
          <button class="btn kucuk" type="button" onclick="kategoriEkle()">Ekle</button></div>` : ''}</section>
    </div>`;
  }
  stokListeYenile();
}

function stokListeYenile() {
  if (!$('stokIcerik')) return;
  if (STK.sekme === 'durum') stokDurumCiz();
  else if (STK.sekme === 'hareketler') hareketListeCiz();
  else tanimlarCiz();
}

function stokDurumCiz() {
  const kutu = $('stkListe'); if (!kutu) return;
  document.querySelectorAll('.cips [data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === STK.filtre));
  const stok = stokHaritasi(), q = trKucuk(STK.arama);
  const aktif = (VERI.stokMalzeme || []).filter(m => m.Aktif);
  const l = aktif
    .filter(m => !STK.kat || m.KategoriId === STK.kat)
    .filter(m => STK.filtre !== 'kritik' || kritikMi(m, stok))
    .filter(m => !q || trKucuk(m.Ad).includes(q))
    .sort((a, b) => trSirala(a.Ad, b.Ad));
  const kritikSay = aktif.filter(m => kritikMi(m, stok)).length;
  $('stkSayac').innerHTML = `${l.length} malzeme${kritikSay ? `, <span class="gecikti">${kritikSay} kritik</span>` : ''}`;

  if (!aktif.length) {
    kutu.innerHTML = `<div class="bos"><div class="b-ikon">📦</div><h3>Henüz malzeme tanımlanmadı</h3>
      <p>${yetki('stok') === 'tam' ? 'Malzemeler ve Kategoriler sekmesinden ilk malzemeyi ekleyin.' : 'Malzeme tanımlandığında burada listelenecek.'}</p>
      ${yetki('stok') === 'tam' ? `<button class="btn" type="button" style="margin-top:16px" onclick="STK.sekme='tanimlar';rotaUygula()">Malzeme Ekle</button>` : ''}</div>`;
    return;
  }
  if (!l.length) { kutu.innerHTML = '<div class="bos"><h3>Sonuç yok</h3><p>Bu arama veya filtrede malzeme yok.</p></div>'; return; }
  kutu.innerHTML = l.map(m => {
    const n = stok[m.Id] || 0, kr = kritikMi(m, stok);
    return `<div class="m-satir" onclick="git('stok/${m.Id}')">
      <span class="ms-ic"><span class="ms-ad">${esc(m.Ad)}</span><span class="ms-alt">${esc(katAdi(m.KategoriId))}${m.KritikSeviye > 0 ? `, kritik seviye ${miktarYaz(m.KritikSeviye)}` : ''}</span></span>
      ${kr ? `<span class="rozet tehlike">${n <= 0 ? 'Stok yok' : 'Kritik'}</span>` : ''}
      <span class="stok-miktar ${kr ? 'kritik' : ''}">${miktarYaz(n)}<small>${esc(m.Birim)}</small></span>
      <span class="ok-ic">›</span></div>`;
  }).join('');
}

function hareketSatirHTML(h, malzemeGoster) {
  const m = malzemeBul(h.MalzemeId);
  const birim = m ? m.Birim : '';
  const e = hareketEtki(h);
  const rota = !h.SiparisId ? '' : h.SiparisTur === 'oxyBakim' ? `oxyweld/b.${h.SiparisId}`
    : SIP[h.SiparisTur] ? `siparisler/${SIP[h.SiparisTur].kisa}.${h.SiparisId}` : '';
  const sip = rota ? `<a class="link" onclick="event.stopPropagation();git('${rota}')">${esc(h.SiparisNo)}</a>` : '';
  const alt = [h.FirmaAd ? esc(h.FirmaAd) : '', sip, h.Aciklama ? esc(h.Aciklama) : '', '@' + esc(h.Olusturan || '?')].filter(Boolean).join(', ');
  return `<div class="h-satir">
    <span class="h-tarih">${tarihKisa(h.Tarih)}</span>
    <span class="h-tur"><span class="rozet ${HAREKET_SINIF[h.Tur] || ''}">${esc(h.Tur)}</span></span>
    <span class="h-ic">${malzemeGoster ? `<b class="link" onclick="git('stok/${h.MalzemeId}')">${esc(m ? m.Ad : h.MalzemeAd)}</b>` : ''}<small>${alt}</small></span>
    <span class="h-miktar ${e >= 0 ? 'arti' : 'eksi'}">${e >= 0 ? '+' : '−'}${miktarYaz(Math.abs(e))} ${esc(birim)}</span>
    ${yetki('stok') === 'tam' ? `<button class="k-sil h-sil" type="button" title="Hareketi sil" aria-label="Hareketi sil" onclick="hareketSilOnay('${h.Id}')">×</button>` : ''}
  </div>`;
}

function hareketListeCiz() {
  const kutu = $('stkListe'); if (!kutu) return;
  document.querySelectorAll('.cips [data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === STK.hTur));
  const q = trKucuk(STK.hArama);
  const turF = { giris: ['Giriş', 'Açılış'], cikis: ['Çıkış'], sayim: ['Sayım'] }[STK.hTur];
  const tum = VERI.stokHareket || [];
  const l = tum
    .filter(h => !turF || turF.includes(h.Tur))
    .filter(h => !q || [h.MalzemeAd, (malzemeBul(h.MalzemeId) || {}).Ad, h.FirmaAd, h.SiparisNo, h.Aciklama].some(x => trKucuk(x).includes(q)))
    .sort(hareketSirala);
  const goster = l.slice(0, 300);
  $('stkSayac').textContent = `${l.length} hareket${l.length > 300 ? ' (son 300 gösteriliyor)' : ''}`;
  kutu.innerHTML = goster.length ? goster.map(h => hareketSatirHTML(h, true)).join('')
    : `<div class="bos"><div class="b-ikon">🔄</div><h3>${tum.length ? 'Sonuç yok' : 'Henüz stok hareketi yok'}</h3></div>`;
}

function tanimlarCiz() {
  const tam = yetki('stok') === 'tam';
  const stok = stokHaritasi();
  const mlz = (VERI.stokMalzeme || []).slice().sort((a, b) => trSirala(a.Ad, b.Ad));
  $('mlzSayac').textContent = `${mlz.length} malzeme`;

    ic.innerHTML = geri + `

        ${tam ? `<div class="d-bas-sag"><button class="btn ikincil" type="button" onclick="malzemeForm('${m.Id}')">Düzenle</button></div>` : ''}
      </div>
      <section class="kart panel">
        <div class="stok-ozet">
          <div><div class="de">Mevcut stok</div><div class="buyuk-stok ${kr ? 'kritik' : ''}">${miktarYaz(n)}<small>${esc(m.Birim)}</small></div></div>
          <div><div class="de">Kritik seviye</div>${m.KritikSeviye > 0 ? miktarYaz(m.KritikSeviye) + ' ' + esc(m.Birim) : '<span class="soluk">Belirtilmemiş</span>'}</div>

        ${m.Notlar ? `<h4 class="panel-alt">Notlar</h4><div class="d-not">${esc(m.Notlar)}</div>` : ''}
      </section>
      <section class="kart panel"><h3 class="panel-bas">Hareket Geçmişi</h3>
        ${hs.length ? `<div class="kart" style="border-radius:8px">${hs.map(h => hareketSatirHTML(h, false)).join('')}</div>`
          : '<div class="bos kucuk-bos"><div class="b-ikon">🔄</div><p>Bu malzemenin henüz hareketi yok.</p></div>'}
      </section>`;
  };
  const hazir = stokOnbellek();
  if (hazir) ciz(); else ic.innerHTML = '<div class="kart bos"><p>Yükleniyor…</p></div>';
  stokVeriYukle()
    .then(() => { if (D.aktif === 'stok' && D.param === id && $('modal').hidden) ciz(); })
    .catch(e => { if (!hazir) ic.innerHTML = `<div class="kart bos"><h3>Bilgiler alınamadı</h3><p>${esc(e.message)}</p></div>`; });

async function malzemeKaydet(id) {

  const kayit = { Id: id || null, Ad: $('mzAd').value.trim(), KategoriId: $('mzKat').value, Birim: $('mzBirim').value,

  if (!kayit.Ad) return hata('Malzeme adı gerekli.');
  if (!(kritik >= 0)) return hata('Kritik seviye geçersiz. Örnek: 5 veya 2,5');
  if (!(bas >= 0)) return hata('Başlangıç stoğu geçersiz. Örnek: 12 veya 2,5');
  if ((VERI.stokMalzeme || []).some(m => m.Id !== kayit.Id && trKucuk(m.Ad) === trKucuk(kayit.Ad))) return hata('Bu isimde bir malzeme zaten var.');
  const btn = $('mzKaydet'); btn.disabled = true; btn.textContent = 'Kaydediliyor…';
  try {
    const r = await api('stok.malzemeKaydet', { kayit, baslangic: bas });
    veriGuncelle('stokMalzeme', r.malzeme);
    if (r.hareket) veriGuncelle('stokHareket', r.hareket);
    modalKapat(); rotaUygula();
    toast(id ? 'Malzeme güncellendi.' : `Malzeme eklendi${r.hareket ? `, başlangıç stoğu ${miktarYaz(r.hareket.Miktar)} ${r.malzeme.Birim}` : ''}.`);

}

function hfBilgi() {
  const m = malzemeBul($('hfMlz').value), kutu = $('hfBilgi');
  if (!m) { kutu.textContent = ''; return; }
  const n = stokHaritasi()[m.Id] || 0, v = sayiOku($('hfMiktar').value);
  let t = `Mevcut stok: ${miktarYaz(n)} ${m.Birim}`;
  if (v >= 0 && !isNaN(v)) {
    if (HF.tur === 'Giriş') t += `, giriş sonrası ${miktarYaz(n + v)} ${m.Birim}`;
    if (HF.tur === 'Çıkış') t += v > n ? `, stok yetersiz` : `, çıkış sonrası ${miktarYaz(n - v)} ${m.Birim}`;
    if (HF.tur === 'Sayım') { const f = Math.round((v - n) * 1000) / 1000; t += f === 0 ? ', fark yok' : `, fark ${f > 0 ? '+' : '−'}${miktarYaz(Math.abs(f))} ${m.Birim}`; }
  }
  kutu.textContent = t;
}
async function hareketKaydet() {
  hfOku();
  const hata = t => ($('mHata').textContent = t);
  const m = malzemeBul(HF.malzemeId), v = sayiOku(HF.miktar);
  if (!m) return hata('Malzeme seçin.');
  if (HF.tur === 'Sayım' ? !(v >= 0) : !(v > 0)) return hata('Miktar geçersiz. Örnek: 12 veya 2,5');
  const n = stokHaritasi()[m.Id] || 0;
  if (HF.tur === 'Çıkış' && v > n) return hata(`Stokta ${miktarYaz(n)} ${m.Birim} var, daha fazla çıkış yapılamaz.`);
  if (HF.tur === 'Sayım' && Math.round((v - n) * 1000) === 0) return hata('Sayılan miktar sistemdekiyle aynı, düzeltme gerekmiyor.');
  const kayit = { Tur: HF.tur, MalzemeId: m.Id, Tarih: HF.tarih || bugun(), FirmaId: HF.firmaId, Aciklama: HF.aciklama.trim() };
  if (HF.tur === 'Sayım') kayit.SayilanMiktar = v; else kayit.Miktar = v;

    toast(`${m.Ad}: ${r.Tur.toLocaleLowerCase('tr-TR')} kaydedildi. Yeni stok ${miktarYaz(stokHaritasi()[m.Id] || 0)} ${m.Birim}.`);
  } catch (e) { hata(e.message); btn.disabled = false; btn.textContent = 'Kaydet'; }
}

// ---------- Excel ve A4 sayım listesi ----------
function stokListeSatirlari(katId) {
  const stok = stokHaritasi();
  return (VERI.stokMalzeme || []).filter(m => m.Aktif && (!katId || m.KategoriId === katId))
    .map(m => ({ ad: m.Ad, kategori: katAdi(m.KategoriId), birim: m.Birim, miktar: stok[m.Id] || 0, kritik: m.KritikSeviye || 0 }))
    .sort((a, b) => (a.kategori === 'Kategorisiz') - (b.kategori === 'Kategorisiz') || trSirala(a.kategori, b.kategori) || trSirala(a.ad, b.ad));
}
function scriptYukle(src) {
  if (document.querySelector(`script[src="${src}"]`)) return Promise.resolve();
  return new Promise((ok, no) => {
    const s = document.createElement('script'); s.src = src; s.onload = ok;
    s.onerror = () => { s.remove(); no(new Error('Excel kütüphanesi yüklenemedi. İnternet bağlantınızı kontrol edin.')); };
    document.head.appendChild(s);
  });
}
async function stokExcel() {
  const satirlar = stokListeSatirlari(STK.kat);
  if (!satirlar.length) return toast('Listede malzeme yok.', true);
  toast('Excel hazırlanıyor…');
  try {
    await scriptYukle('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const aoa = [['Malzeme', 'Kategori', 'Birim', 'Sistemdeki Miktar', 'Kritik Seviye', 'Sayılan Miktar', 'Fark', 'Not'],
      ...satirlar.map(r => [r.ad, r.kategori, r.birim, r.miktar, r.kritik || '', '', '', ''])];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    satirlar.forEach((r, i) => { const n = i + 2; ws['G' + n] = { t: 'n', f: `IF(F${n}="","",F${n}-D${n})` }; });
    ws['!cols'] = [{ wch: 38 }, { wch: 18 }, { wch: 8 }, { wch: 17 }, { wch: 13 }, { wch: 15 }, { wch: 10 }, { wch: 28 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Stok');
    XLSX.writeFile(wb, `Locus_Stok_${bugun()}.xlsx`);
  } catch (e) { toast(e.message, true); }
}

/** A4 çıktı: içerik #yazdirAlan'a konur; alt bilgi (sol) ve "Sayfa 1 / 3" (sağ) sayfa kenarına CSS ile basılır. */
function yazdir(html, altYazi) {
  let alan = $('yazdirAlan');
  if (!alan) { alan = document.createElement('div'); alan.id = 'yazdirAlan'; document.body.appendChild(alan); }
  document.documentElement.style.setProperty('--y-alt', JSON.stringify(String(altYazi || '')));
  alan.innerHTML = html;
  modalKapat();
  const img = alan.querySelector('img');
  const bas = () => setTimeout(() => window.print(), 50);
  if (!img || img.complete) bas(); else { img.onload = bas; img.onerror = bas; }
}

       <button class="btn" type="button" onclick="modalKapat();STK.sekme='tanimlar';git('stok')">Malzeme Tanımla</button>`);
    return;
  }
  const stok = stokHaritasi();
  SI = { t, id, tur, satirlar: (x.Kalemler || []).map(k => ({
    miktar: sayiYaz(k.miktar),
    malzemeId: (mlz.find(m => trKucuk(m.Ad) === trKucuk(k.aciklama)) || {}).Id || ''
  })) };
  modalAc(`${x.No}: Stoka ${tur}`, `
    <p class="bilgi-not" style="margin:0 0 8px">Her kalemi stoktaki bir malzemeyle eşleştirin. Stoğa girmeyecek kalemler (nakliye, hizmet vb.) için "Stoka işleme" seçili kalsın.</p>
    ${(x.Kalemler || []).map((k, i) => `
      <div class="si-satir">
        <div class="si-ac"><b>${esc(k.aciklama)}</b><small>Siparişte: ${miktarYaz(k.miktar)} ${esc(k.birim)}</small></div>
        <select class="girdi" onchange="SI.satirlar[${i}].malzemeId=this.value"><option value="">Stoka işleme</option>${mlz.map(m =>
          `<option value="${m.Id}" ${SI.satirlar[i].malzemeId === m.Id ? 'selected' : ''}>${esc(m.Ad)} (${miktarYaz(stok[m.Id] || 0)} ${esc(m.Birim)})</option>`).join('')}</select>
        <input class="girdi" inputmode="decimal" value="${esc(SI.satirlar[i].miktar)}" aria-label="Miktar" oninput="SI.satirlar[${i}].miktar=this.value">
      </div>`).join('')}
    <div class="hata-kutu" id="mHata"></div>`,
    `<button class="btn ikincil" type="button" onclick="modalKapat()">Şimdi Değil</button>
     <button class="btn" type="button" id="siKaydet" onclick="stokIsleKaydet()">Stoka İşle</button>`, true);
}

async function stokIsleKaydet() {
  const x = (VERI[SI.t] || []).find(k => k.Id === SI.id);
  const hata = t => ($('mHata').textContent = t);
  const hareketler = [];
  for (const s of SI.satirlar) {
    if (!s.malzemeId) continue;
    const v = sayiOku(s.miktar);
    if (!(v > 0)) return hata('Eşleştirilen kalemlerde miktar geçersiz.');
    hareketler.push({ Tur: SI.tur, MalzemeId: s.malzemeId, Miktar: v, Tarih: bugun(), FirmaId: x.FirmaId, SiparisTur: SI.t, SiparisId: x.Id });
  }
  if (!hareketler.length) return hata('En az bir kalemi bir malzemeyle eşleştirin.');
  const btn = $('siKaydet'); btn.disabled = true; btn.textContent = 'İşleniyor…';
  try {
    const r = await api('stok.topluHareket', { hareketler });
    r.forEach(h => veriGuncelle('stokHareket', h));
    modalKapat(); rotaUygula();
    toast(`${x.No}: ${r.length} kalem stoka işlendi.`);
  } catch (e) { hata(e.message); btn.disabled = false; btn.textContent = 'Stoka İşle'; }
}


// ==================== TEKLİFLER ====================
// Teklif no otomatik (TKL261001-1), revizyonlar TKL261001-1-R1 ... Para birimleri ayrı, çevrim yok.
const TK = { arama: '', filtre: 'acik' };
let TF = null;           // açık teklif formu
let TEKLIF_AYAR = null;  // firma bilgileri, banka, varsayılan şartlar
const TEKLIF_DURUM_SINIF = { 'Taslak': 'uyari', 'Gönderildi': '', 'Kabul Edildi': 'ok', 'Reddedildi': 'tehlike', 'Revize Edildi': 'pasif' };
const TEKLIF_SECILEBILIR = ['Taslak', 'Gönderildi', 'Kabul Edildi', 'Reddedildi'];
const teklifBul = id => (VERI.teklif || []).find(x => x.Id === id);
const teklifSuresiDoldu = t => t.Durum === 'Gönderildi' && t.GecerlilikTarihi && t.GecerlilikTarihi < bugun();
const teklifDuzenlenebilir = t => !t.SiparisId && t.Durum !== 'Revize Edildi';
const teklifRozet = t => `<span class="rozet ${TEKLIF_DURUM_SINIF[t.Durum] || ''}">${esc(t.Durum)}</span>${teklifSuresiDoldu(t) ? ' <span class="rozet tehlike">Süresi doldu</span>' : ''}`;
const teklifSirala = (a, b) => String(b.Tarih).localeCompare(String(a.Tarih))
  || siraNo(b.AnaNo || b.No) - siraNo(a.AnaNo || a.No) || (b.Revizyon || 0) - (a.Revizyon || 0);
const gunEkle = (tarih, gun) => { const d = new Date(tarih + 'T12:00:00'); d.setDate(d.getDate() + gun); return d.toISOString().slice(0, 10); };

async function teklifAyarYukle(zorla) {
  if (!TEKLIF_AYAR) TEKLIF_AYAR = ls.al('locus_c_teklifAyar');
  if (TEKLIF_AYAR && !zorla) { api('ayar.oku', { anahtar: 'teklif' }).then(r => { TEKLIF_AYAR = r; ls.koy('locus_c_teklifAyar', r); }).catch(() => {}); return TEKLIF_AYAR; }
  try { TEKLIF_AYAR = await api('ayar.oku', { anahtar: 'teklif' }); ls.koy('locus_c_teklifAyar', TEKLIF_AYAR); }
  catch (e) { TEKLIF_AYAR = TEKLIF_AYAR || {}; }
  return TEKLIF_AYAR;
}
function teklifOnbellek() {
  if (!VERI.teklif) VERI.teklif = ls.al('locus_c_teklif') || undefined;
  if (!FIRMALAR) FIRMALAR = ls.al('locus_c_firmalar');
  return !!VERI.teklif;
}
const teklifVeriYukle = () => Promise.all([veriYukle('teklif'), firmalarYukle().catch(() => null), teklifAyarYukle().catch(() => null)]);

SAYFA_CIZ.teklifler = function (ic, s, y) {
  if (D.param) return teklifDetay(ic, s, y, D.param);

  ic.innerHTML = sayfaBasHTML(s, y, tam ? `<button class="btn ikincil" type="button" onclick="teklifAyarModal()">⚙️ Ayarlar</button>

    <div class="arac">
      <label class="arama"><span>🔍</span><input type="search" autocomplete="off" placeholder="Teklif no, müşteri veya konu ara" value="${esc(TK.arama)}" oninput="TK.arama=this.value;teklifListeCiz()"></label>
      <div class="cips">${[['acik', 'Açık'], ['kabul', 'Kabul'], ['red', 'Red'], ['tumu', 'Tümü']].map(([k, a]) =>

  teklifVeriYukle().then(() => { if (D.aktif === 'teklifler' && !D.param && $('modal').hidden) teklifListeCiz(); })
    .catch(e => { if (!hazir && $('tkListe')) $('tkListe').innerHTML = `<div class="bos"><h3>Liste alınamadı</h3><p>${esc(e.message)}</p></div>`; });
};

function teklifListeCiz() {
  const kutu = $('tkListe'); if (!kutu) return;
  document.querySelectorAll('.cips [data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === TK.filtre));
  const tum = VERI.teklif || [], q = trKucuk(TK.arama), tam = yetki('teklifler') === 'tam';
  const filtre = { acik: ['Taslak', 'Gönderildi'], kabul: ['Kabul Edildi'], red: ['Reddedildi'] }[TK.filtre];
  const l = tum.filter(t => !filtre || filtre.includes(t.Durum))
    .filter(t => !q || [t.No, t.FirmaAd, t.Konu, t.YetkiliAd].some(x => trKucuk(x).includes(q)))
    .sort(teklifSirala);
  const top = {};
  l.filter(t => !['Reddedildi', 'Revize Edildi'].includes(t.Durum)).forEach(t => top[t.ParaBirimi] = (top[t.ParaBirimi] || 0) + Number(t.Toplam));
  $('tkOzet').innerHTML = `<span class="soluk">${l.length} teklif</span>` + Object.keys(PARA).filter(p => top[p]).map(p => `<span class="ozet-tutar">${para(top[p], p)}</span>`).join('');
  if (!tum.length) {
    kutu.innerHTML = `<div class="bos"><div class="b-ikon">📝</div><h3>Henüz teklif yok</h3>
      <p>${tam ? 'İlk teklifi Yeni Teklif ile oluşturun. Önce Ayarlar\'dan firma ve banka bilgilerinizi girmenizi öneririz.' : 'Teklifler burada listelenecek.'}</p></div>`;
    return;
  }
  if (!l.length) { kutu.innerHTML = `<div class="bos"><h3>${q ? 'Sonuç yok' : 'Bu filtrede teklif yok'}</h3></div>`; return; }
  kutu.innerHTML = l.map(t => `<div class="m-satir s-satir" onclick="git('teklifler/${t.Id}')">
      <span class="s-no"><b>${esc(t.No)}</b><small>${tarihKisa(t.Tarih)}</small></span>
      <span class="ms-ic"><span class="ms-ad">${esc(t.FirmaAd)}</span><span class="ms-alt">${esc(t.Konu || kalemOzet(t))}${t.SiparisNo ? ', sipariş ' + esc(t.SiparisNo) : ''}</span></span>
      <span class="s-tutar">${para(t.Toplam, t.ParaBirimi)}</span>
      <span class="oxy-durum">${teklifRozet(t)}</span>
      <span class="m-btn">
        <button class="btn ikincil kucuk" type="button" onclick="event.stopPropagation();teklifExcel('${t.Id}')">⬇ Excel</button>
        ${tam && teklifDuzenlenebilir(t) ? `<button class="btn ikincil kucuk" type="button" onclick="event.stopPropagation();teklifForm('${t.Id}')">Düzenle</button>` : ''}
      </span></div>`).join('');
}

async function teklifDurum(id, durum) {
  const t = teklifBul(id); if (!t) return;
  try {
    const r = await api('kayit.kaydet', { varlik: 'teklif', kayit: Object.assign({}, t, { Durum: durum }) });
    veriGuncelle('teklif', r); toast(`${r.No}: ${durum}`);
    if (durum === 'Kabul Edildi' && yetki('siparisler') === 'tam') { rotaUygula(); return teklifSiparisOnay(id); }
  } catch (e) { toast(e.message, true); }
  rotaUygula();
}

function teklifSiparisOnay(id) {
  const t = teklifBul(id);
  modalAc('Siparişe Dönüştür', `<p><b>${esc(t.No)}</b> (${esc(t.FirmaAd)}, ${para(t.Toplam, t.ParaBirimi)}) müşteri siparişine dönüştürülsün mü?</p>
    <p style="color:var(--mute);margin-top:10px;font-size:14px">Kalemler iskontolu net fiyatlarıyla yeni bir müşteri siparişine (LOC…) aktarılır, teklif "Kabul Edildi" olur ve artık düzenlenemez.</p>
    <div class="hata-kutu" id="mHata"></div>`,
    `<button class="btn ikincil" type="button" onclick="modalKapat()">Şimdi Değil</button>
     <button class="btn" type="button" id="tsKaydet" onclick="teklifSiparisYap('${id}')">🛒 Siparişe Dönüştür</button>`);
}
async function teklifSiparisYap(id) {
  const btn = $('tsKaydet'); btn.disabled = true; btn.textContent = 'Dönüştürülüyor…';
  try {
    const r = await api('teklif.siparisYap', { id });
    veriGuncelle('teklif', r.teklif); veriGuncelle('musteriSiparis', r.siparis);
    modalKapat(); rotaUygula(); toast(`${r.teklif.No} → ${r.siparis.No} siparişi oluşturuldu.`);
  } catch (e) { $('mHata').textContent = e.message; btn.disabled = false; btn.textContent = '🛒 Siparişe Dönüştür'; }
}
async function teklifRevize(id) {
  const t = teklifBul(id);
  if (!confirm(`${t.No} için yeni revizyon oluşturulsun mu? Mevcut teklif "Revize Edildi" olarak işaretlenir.`)) return;
  try {
    const r = await api('teklif.revize', { id });
    veriGuncelle('teklif', r.eski); veriGuncelle('teklif', r.yeni);
    await veriYukle('teklif').catch(() => null);
    toast(`${r.yeni.No} oluşturuldu.`); git('teklifler/' + r.yeni.Id);
    setTimeout(() => teklifForm(r.yeni.Id), 300);
  } catch (e) { toast(e.message, true); }
}
function teklifSilOnay(id) {
  const t = teklifBul(id);
  modalAc('Teklifi Sil', `<p><b>${esc(t.No)}</b> kalıcı olarak silinecek.</p>
    <p style="color:var(--mute);margin-top:10px;font-size:14px">Gönderilmiş bir teklifse silmek yerine durumunu Reddedildi yapmanız geçmiş kayıtlar için daha iyi olur.</p><div class="hata-kutu" id="mHata"></div>`,
    `<button class="btn ikincil" type="button" onclick="modalKapat()">Vazgeç</button><button class="btn tehlike" type="button" id="mSil" onclick="teklifSil('${id}')">Sil</button>`);
}
async function teklifSil(id) {
  const btn = $('mSil'); btn.disabled = true;

}

async function teklifForm(id, kopyaId) {
  const t = id ? teklifBul(id) : null, kaynak = t || (kopyaId ? teklifBul(kopyaId) : null);
  if (!FIRMALAR) { try { await firmalarYukle(); } catch (e) { return toast(e.message, true); } }
  const a = TEKLIF_AYAR || await teklifAyarYukle();
  const musteriler = (FIRMALAR.musteriler || []).filter(f => f.Aktif || (kaynak && f.Id === kaynak.FirmaId)).sort((x, y) => trSirala(x.Ad, y.Ad));
  if (!musteriler.length) {
    modalAc('Yeni Teklif', '<p>Teklif hazırlamak için önce Müşteriler sayfasında müşteri tanımlanmalı.</p>',
      `<button class="btn ikincil" type="button" onclick="modalKapat()">Kapat</button>`);
    return;
  }
  const tarih = t ? t.Tarih : bugun(), gun = Number(a.GecerlilikGun) || 15;
  TF = {
    Id: t ? t.Id : null, pb: kaynak ? kaynak.ParaBirimi : 'EUR', gecerlilikElle: !!t,
    kalemler: kaynak ? kaynak.Kalemler.map(k => ({ aciklama: k.aciklama, miktar: sayiYaz(k.miktar), birim: k.birim, birimFiyat: sayiYaz(k.birimFiyat), iskonto: k.iskonto ? sayiYaz(k.iskonto) : '' }))
      : [{ aciklama: '', miktar: '1', birim: 'adet', birimFiyat: '', iskonto: '' }]
  };
  modalAc(t ? `${t.No} Düzenle` : kopyaId ? `Yeni Teklif (${kaynak.No} kopyası)` : 'Yeni Teklif', `
    <div class="iki">

function tfYetkililer() {
  const f = ((FIRMALAR || {}).musteriler || []).find(x => x.Id === $('tfMus').value);
  $('tfYetkiliListe').innerHTML = (f && f.Yetkililer || []).filter(y => y.adSoyad).map(y => `<option value="${esc(y.adSoyad)}">${esc(y.pozisyon || '')}</option>`).join('');
}
function tfPb(pb) { TF.pb = pb; document.querySelectorAll('[data-pb]').forEach(b => b.classList.toggle('on', b.dataset.pb === pb)); tfHesapla(); }
function tfKalemCiz() {
  $('tfKalemler').innerHTML = TF.kalemler.map((k, i) => `
    <div class="tk-kalem">
      <textarea class="girdi k-ac" rows="1" placeholder="Ürün / hizmet açıklaması" oninput="TF.kalemler[${i}].aciklama=this.value">${esc(k.aciklama)}</textarea>
      <input class="girdi" inputmode="decimal" placeholder="Miktar" value="${esc(k.miktar)}" oninput="TF.kalemler[${i}].miktar=this.value;tfHesapla()">
      <select class="girdi" onchange="TF.kalemler[${i}].birim=this.value">${[...new Set([...BIRIMLER, k.birim || 'adet'])].map(b =>
        `<option ${b === (k.birim || 'adet') ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>
      <input class="girdi" inputmode="decimal" placeholder="Birim fiyat" value="${esc(k.birimFiyat)}" oninput="TF.kalemler[${i}].birimFiyat=this.value;tfHesapla()">
      <input class="girdi" inputmode="decimal" placeholder="İsk. %" value="${esc(k.iskonto)}" oninput="TF.kalemler[${i}].iskonto=this.value;tfHesapla()">
      <span class="k-tutar" id="tft${i}"></span>
      <button class="k-sil" type="button" aria-label="Kalemi kaldır" ${TF.kalemler.length === 1 ? 'disabled' : ''} onclick="TF.kalemler.splice(${i},1);tfKalemCiz()">×</button>
    </div>`).join('');
  tfHesapla();
}
function tfHesapla() {
  if (!$('tfToplam')) return;
  const yuv = n => Math.round((n + Number.EPSILON) * 100) / 100;
  let brut = 0, isk = 0;
  TF.kalemler.forEach((k, i) => {
    const m = sayiOku(k.miktar), f = sayiOku(k.birimFiyat), d = String(k.iskonto).trim() ? sayiOku(k.iskonto) : 0;
    const ok = m > 0 && f >= 0 && d >= 0 && d <= 100;
    const b = ok ? yuv(m * f) : 0, di = ok ? yuv(b * d / 100) : 0;
    brut += b; isk += di;
    if ($('tft' + i)) $('tft' + i).textContent = ok ? para(b - di, TF.pb) : '—';
  });
  const ara = yuv(brut - isk), oran = Number($('tfKdv').value), kdv = yuv(ara * oran / 100);
  $('tfToplam').innerHTML = `${isk > 0 ? `<div><span>Toplam</span><span>${para(brut, TF.pb)}</span></div><div><span>İskonto</span><span>−${para(isk, TF.pb)}</span></div>` : ''}
    <div><span>Ara toplam</span><span>${para(ara, TF.pb)}</span></div>
    <div><span>KDV (%${oran})</span><span>${para(kdv, TF.pb)}</span></div>
    <div class="genel"><span>Genel toplam</span><span>${para(yuv(ara + kdv), TF.pb)}</span></div>`;
}
async function teklifKaydet() {
  const hata = m => ($('mHata').textContent = m);
  const kalemler = TF.kalemler.filter(k => k.aciklama.trim() || String(k.birimFiyat).trim())
    .map(k => ({ aciklama: k.aciklama.trim(), miktar: sayiOku(k.miktar), birim: k.birim || 'adet', birimFiyat: sayiOku(k.birimFiyat),
                 iskonto: String(k.iskonto).trim() ? sayiOku(k.iskonto) : 0 }));
  const kayit = {
    Id: TF.Id, FirmaId: $('tfMus').value, YetkiliAd: $('tfYetkili').value.trim(), Konu: $('tfKonu').value.trim(),
    Tarih: $('tfTarih').value, GecerlilikTarihi: $('tfGec').value, ParaBirimi: TF.pb, KdvOrani: Number($('tfKdv').value),
    Durum: $('tfDurum') ? $('tfDurum').value : 'Taslak', Kalemler: kalemler,
    OdemeSartlari: $('tfOdeme').value.trim(), TeslimSartlari: $('tfTeslim').value.trim(), Notlar: $('tfNot').value.trim()
  };
  if (!kayit.FirmaId) return hata('Müşteri seçin.');
  if (!kayit.Tarih) return hata('Teklif tarihi gerekli.');
  if (kayit.GecerlilikTarihi && kayit.GecerlilikTarihi < kayit.Tarih) return hata('Geçerlilik tarihi teklif tarihinden önce olamaz.');
  if (!kalemler.length) return hata('En az bir kalem girin.');
  for (let i = 0; i < kalemler.length; i++) {
    const k = kalemler[i];
    if (!k.aciklama) return hata(`${i + 1}. kalemin açıklaması boş.`);
    if (!(k.miktar > 0)) return hata(`${i + 1}. kalemde miktar geçersiz.`);
    if (!(k.birimFiyat >= 0)) return hata(`${i + 1}. kalemde birim fiyat geçersiz. Örnek: 1250,50`);
    if (!(k.iskonto >= 0 && k.iskonto <= 100)) return hata(`${i + 1}. kalemde iskonto 0-100 arasında olmalı.`);
  }
  const btn = $('tfKaydet'); btn.disabled = true; btn.textContent = 'Kaydediliyor…';
  try {
    const r = await api('kayit.kaydet', { varlik: 'teklif', kayit });
    veriGuncelle('teklif', r); modalKapat();
    toast(`${r.No} ${kayit.Id ? 'güncellendi' : 'oluşturuldu'}.`);
    if (D.aktif === 'teklifler' && D.param === r.Id) rotaUygula(); else git('teklifler/' + r.Id);
  } catch (e) { hata(e.message); btn.disabled = false; btn.textContent = 'Kaydet'; }
}

// ---------- Excel çıktısı (Locus logolu, formüllü, A4) ----------
async function resimBase64(url) {
  const blob = await (await fetch(url)).blob();
  return await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
}
function dosyaIndir(blob, ad) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = ad; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const dosyaAdi = s => String(s || '').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '_').slice(0, 40).replace(/[._]+$/, '');

async function teklifExcel(id) {
  const t = teklifBul(id); if (!t) return;
  toast('Excel hazırlanıyor…');
  try {
    const a = TEKLIF_AYAR || await teklifAyarYukle();
    await scriptYukle('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
    const LACI = 'FF004085', GRI = 'FFF2F5F9', CIZGI = { style: 'thin', color: { argb: 'FFB8C2D0' } };
    const PB = { TRY: '#,##0.00 "₺"', EUR: '#,##0.00 "€"', USD: '"$"#,##0.00' }[t.ParaBirimi] || '#,##0.00';
    const wb = new ExcelJS.Workbook(); wb.creator = 'Locus Şirket Takip Sistemi';
    const ws = wb.addWorksheet('Teklif', {
      views: [{ showGridLines: false }],
      pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
                   margins: { left: 0.45, right: 0.45, top: 0.5, bottom: 0.6, header: 0.2, footer: 0.3 } },
      headerFooter: { oddFooter: `&L&8${t.No}&R&8Sayfa &P / &N` }
    });
    ws.columns = [{ width: 6 }, { width: 46 }, { width: 9 }, { width: 8 }, { width: 15 }, { width: 8 }, { width: 17 }];
    const yaz = (ref, deger, stil) => { const c = ws.getCell(ref); c.value = deger; if (stil) Object.assign(c, stil); return c; };
    const font = (o) => Object.assign({ name: 'Calibri', size: 10 }, o);

    // Başlık: logo (sol) + firma bilgileri (sağ)
    const logo = wb.addImage({ base64: await resimBase64('logo-renkli.png'), extension: 'png' });
    ws.addImage(logo, { tl: { col: 0.1, row: 0.3 }, ext: { width: 210, height: 57 } });
    const firmaSatir = [a.Unvan, a.Adres, [a.Telefon && 'Tel: ' + a.Telefon, a.Eposta].filter(Boolean).join('  |  '),
      [a.Web, (a.VergiDairesi || a.VergiNo) && `V.D.: ${a.VergiDairesi || ''} ${a.VergiNo || ''}`.trim()].filter(Boolean).join('  |  ')].filter(Boolean);
    firmaSatir.slice(0, 4).forEach((s, i) => {
      ws.mergeCells(`C${i + 1}:G${i + 1}`);
      yaz(`C${i + 1}`, s.replace(/\n/g, ', '), { font: font(i === 0 ? { bold: true, size: 11, color: { argb: LACI } } : { size: 9, color: { argb: 'FF505A6B' } }), alignment: { horizontal: 'right', vertical: 'middle' } });
    });
    let r = 6;
    ws.mergeCells(`A${r}:G${r}`);
    yaz(`A${r}`, 'FİYAT TEKLİFİ', { font: font({ bold: true, size: 16, color: { argb: LACI } }), alignment: { horizontal: 'left', vertical: 'middle' },
      border: { bottom: { style: 'medium', color: { argb: LACI } } } });
    ws.getRow(r).height = 26;

    // Müşteri ve teklif bilgileri
    r = 8;
    const sol = [['Firma', t.FirmaAd], ['Sayın', t.YetkiliAd || '—'], ['Konu', t.Konu || '—']];
    const sag = [['Teklif No', t.No], ['Tarih', tarihKisa(t.Tarih)], ['Geçerlilik', t.GecerlilikTarihi ? tarihKisa(t.GecerlilikTarihi) : '—'], ['Para birimi', PARA[t.ParaBirimi]]];
    for (let i = 0; i < 4; i++) {
      const satir = r + i;
      if (sol[i]) { ws.mergeCells(`A${satir}:D${satir}`); yaz(`A${satir}`, { richText: [{ text: sol[i][0] + ': ', font: font({ bold: true }) }, { text: String(sol[i][1]), font: font() }] }, { alignment: { vertical: 'middle', wrapText: true } }); }
      ws.mergeCells(`E${satir}:F${satir}`);
      yaz(`E${satir}`, sag[i][0], { font: font({ bold: true }), alignment: { horizontal: 'right' } });
      yaz(`G${satir}`, sag[i][1], { font: font(), alignment: { horizontal: 'right' } });
    }

    // Kalem tablosu
    r = 13;
    const basliklar = ['Sıra', 'Açıklama', 'Miktar', 'Birim', 'Birim Fiyat', 'İsk. %', 'Tutar'];
    basliklar.forEach((b, i) => {
      const c = ws.getCell(r, i + 1);
      c.value = b; c.font = font({ bold: true, color: { argb: 'FFFFFFFF' } });
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: LACI } };
      c.alignment = { horizontal: i === 1 ? 'left' : 'center', vertical: 'middle' };
      c.border = { top: CIZGI, bottom: CIZGI, left: CIZGI, right: CIZGI };
    });
    ws.getRow(r).height = 20;
    const ilk = r + 1;
    (t.Kalemler || []).forEach((k, i) => {
      const n = ilk + i, row = ws.getRow(n);
      row.values = [i + 1, k.aciklama, Number(k.miktar), k.birim, Number(k.birimFiyat), Number(k.iskonto) || 0];
      ws.getCell(`G${n}`).value = { formula: `ROUND(C${n}*E${n}*(1-F${n}/100),2)`, result: Number(k.tutar) };
      for (let c = 1; c <= 7; c++) {
        const h = ws.getCell(n, c);
        h.font = font(); h.border = { top: CIZGI, bottom: CIZGI, left: CIZGI, right: CIZGI };
        h.alignment = { vertical: 'top', horizontal: c === 2 ? 'left' : c === 4 ? 'center' : c === 1 ? 'center' : 'right', wrapText: c === 2 };
      }
      ws.getCell(`C${n}`).numFmt = '#,##0.###'; ws.getCell(`E${n}`).numFmt = PB; ws.getCell(`F${n}`).numFmt = '0.##'; ws.getCell(`G${n}`).numFmt = PB;
      const satirSay = String(k.aciklama).split('\n').reduce((s, p) => s + Math.max(1, Math.ceil(p.length / 52)), 0);
      row.height = Math.max(18, satirSay * 14);
    });
    const son = ilk + (t.Kalemler || []).length - 1;

    // Toplamlar (formüllü)
    r = son + 1;
    const toplamSatir = (et, formul, sonuc, kalin) => {
      ws.mergeCells(`E${r}:F${r}`);
      yaz(`E${r}`, et, { font: font({ bold: !!kalin }), alignment: { horizontal: 'right' } });
      const c = yaz(`G${r}`, { formula: formul, result: sonuc }, { font: font({ bold: !!kalin, size: kalin ? 11 : 10 }), numFmt: PB, alignment: { horizontal: 'right' } });
      if (kalin) { c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: GRI } }; ws.getCell(`E${r}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: GRI } };
        c.border = { top: { style: 'thin', color: { argb: LACI } }, bottom: { style: 'double', color: { argb: LACI } } }; }
      return r++;
    };
    r++;
    let araRef;
    if (t.IskontoToplam > 0) {
      const b = toplamSatir('Toplam', `SUMPRODUCT(ROUND(C${ilk}:C${son}*E${ilk}:E${son},2))`, t.BrutToplam);
      toplamSatir('İskonto', `G${b}-SUM(G${ilk}:G${son})`, t.IskontoToplam);
    }
    araRef = toplamSatir('Ara Toplam', `SUM(G${ilk}:G${son})`, t.AraToplam);
    const kdvRef = toplamSatir(`KDV (%${t.KdvOrani})`, `ROUND(G${araRef}*${t.KdvOrani}/100,2)`, t.Kdv);
    toplamSatir('GENEL TOPLAM', `G${araRef}+G${kdvRef}`, t.Toplam, true);

    // Şartlar, notlar, banka bilgileri
    r += 1;
    const blok = (baslik, metin) => {
      if (!metin) return;
      ws.mergeCells(`A${r}:G${r}`); yaz(`A${r}`, baslik, { font: font({ bold: true, color: { argb: LACI } }) }); r++;
      ws.mergeCells(`A${r}:G${r}`);
      yaz(`A${r}`, metin, { font: font(), alignment: { wrapText: true, vertical: 'top' } });
      ws.getRow(r).height = Math.max(16, String(metin).split('\n').reduce((s, p) => s + Math.max(1, Math.ceil(p.length / 105)), 0) * 14);
      r += 2;
    };
    blok('Ödeme Şartları', t.OdemeSartlari);
    blok('Teslim Şartları', t.TeslimSartlari);
    blok('Notlar', t.Notlar);
    blok('Banka Bilgileri', a.Banka);
    if (a.AltNot) { ws.mergeCells(`A${r}:G${r}`); yaz(`A${r}`, a.AltNot, { font: font({ italic: true, size: 9, color: { argb: 'FF6A7890' } }), alignment: { wrapText: true } }); r += 2; }

    // Kapanış ve imza
    ws.mergeCells(`E${r}:G${r}`); yaz(`E${r}`, 'Saygılarımızla,', { font: font(), alignment: { horizontal: 'center' } }); r++;
    ws.mergeCells(`E${r}:G${r}`); yaz(`E${r}`, a.Unvan || 'Locus Mühendislik', { font: font({ bold: true }), alignment: { horizontal: 'center' } }); r += 3;
    ws.mergeCells(`E${r}:G${r}`); yaz(`E${r}`, a.Imza || '', { font: font(), alignment: { horizontal: 'center' }, border: { top: { style: 'thin' } } });
    ws.pageSetup.printArea = `A1:G${r}`;

    const tampon = await wb.xlsx.writeBuffer();
    dosyaIndir(new Blob([tampon], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `${t.No}_${dosyaAdi(t.FirmaAd)}.xlsx`);
    toast('Excel indirildi.');
  } catch (e) { toast('Excel oluşturulamadı: ' + e.message, true); }
}

async function teklifYazdir(id) {
  const t = teklifBul(id); if (!t) return;
  const a = TEKLIF_AYAR || await teklifAyarYukle();
  const iskVar = (t.Kalemler || []).some(k => Number(k.iskonto) > 0);
  const firma = [a.Unvan ? `<b>${esc(a.Unvan)}</b>` : '', a.Adres ? esc(a.Adres).replace(/\n/g, '<br>') : '',
    [a.Telefon && 'Tel: ' + esc(a.Telefon), a.Eposta && esc(a.Eposta)].filter(Boolean).join(' | '),
    [a.Web && esc(a.Web), (a.VergiDairesi || a.VergiNo) && `V.D.: ${esc(a.VergiDairesi || '')} ${esc(a.VergiNo || '')}`].filter(Boolean).join(' | ')].filter(Boolean).join('<br>');
  const blok = (b, m) => m ? `<div class="y-blok"><h3>${b}</h3><p>${esc(m).replace(/\n/g, '<br>')}</p></div>` : '';
  yazdir(`
    <div class="y-bas"><img src="logo-renkli.png" alt="Locus Engineering"><div class="y-bas-sag">${firma}</div></div>
    <h1 class="y-baslik">Fiyat Teklifi</h1>
    <table class="y-bilgi"><tr>
      <td><span>Firma</span>${esc(t.FirmaAd)}</td><td><span>Sayın</span>${esc(t.YetkiliAd || '—')}</td>
      <td><span>Teklif no</span>${esc(t.No)}</td><td><span>Tarih</span>${tarihKisa(t.Tarih)}</td></tr><tr>
      <td colspan="2"><span>Konu</span>${esc(t.Konu || '—')}</td>
      <td><span>Geçerlilik</span>${t.GecerlilikTarihi ? tarihKisa(t.GecerlilikTarihi) : '—'}</td><td><span>Para birimi</span>${PARA[t.ParaBirimi]}</td></tr></table>
    <table class="y-tablo"><thead><tr><th class="y-no">#</th><th>Açıklama</th><th class="y-sayi">Miktar</th><th class="y-sayi">Birim fiyat</th>${iskVar ? '<th class="y-sayi">İsk.</th>' : ''}<th class="y-sayi">Tutar</th></tr></thead>
      <tbody>${(t.Kalemler || []).map((k, i) => `<tr><td class="y-no">${i + 1}</td><td>${esc(k.aciklama).replace(/\n/g, '<br>')}</td>
        <td class="y-sayi y-nw">${sayiGoster(k.miktar)} ${esc(k.birim)}</td><td class="y-sayi y-nw">${para(k.birimFiyat, t.ParaBirimi)}</td>
        ${iskVar ? `<td class="y-sayi">${Number(k.iskonto) ? '%' + sayiGoster(k.iskonto) : '—'}</td>` : ''}<td class="y-sayi y-nw">${para(k.tutar, t.ParaBirimi)}</td></tr>`).join('')}</tbody></table>
    <table class="y-toplam">
      ${t.IskontoToplam > 0 ? `<tr><td>Toplam</td><td>${para(t.BrutToplam, t.ParaBirimi)}</td></tr><tr><td>İskonto</td><td>−${para(t.IskontoToplam, t.ParaBirimi)}</td></tr>` : ''}
      <tr><td>Ara toplam</td><td>${para(t.AraToplam, t.ParaBirimi)}</td></tr>
      <tr><td>KDV (%${t.KdvOrani})</td><td>${para(t.Kdv, t.ParaBirimi)}</td></tr>
      <tr class="genel"><td>Genel toplam</td><td>${para(t.Toplam, t.ParaBirimi)}</td></tr></table>
    ${blok('Ödeme şartları', t.OdemeSartlari)}${blok('Teslim şartları', t.TeslimSartlari)}${blok('Notlar', t.Notlar)}${blok('Banka bilgileri', a.Banka)}
    ${a.AltNot ? `<p class="y-altnot">${esc(a.AltNot)}</p>` : ''}
    <div class="y-kapanis"><div>Saygılarımızla,<br><b>${esc(a.Unvan || 'Locus Mühendislik')}</b></div><div class="y-imza-cizgi">${esc(a.Imza || '')}</div></div>`,
    `${t.No}, ${t.FirmaAd}`);
}

// ==================== ŞİFRE DEĞİŞTİR ====================
function sifreModal() {
  $('kulMenuKutu').hidden = true;
  modalAc('Şifre Değiştir', `
    <label class="et" for="sEski">Mevcut şifre</label><input class="girdi" id="sEski" type="password" autocomplete="current-password">
    <label class="et" for="sYeni">Yeni şifre</label><input class="girdi" id="sYeni" type="password" autocomplete="new-password" placeholder="En az 6 karakter">
    <label class="et" for="sYeni2">Yeni şifre (tekrar)</label><input class="girdi" id="sYeni2" type="password" autocomplete="new-password">
    <div class="hata-kutu" id="mHata"></div>`,
    `<button class="btn ikincil" type="button" onclick="modalKapat()">Vazgeç</button>
     <button class="btn" type="button" id="sKaydet" onclick="sifreKaydet()">Şifreyi Değiştir</button>`);
  setTimeout(() => $('sEski').focus(), 50);
}

async function sifreKaydet() {
  const yeni = $('sYeni').value;
  if (yeni.length < 6) return ($('mHata').textContent = 'Yeni şifre en az 6 karakter olmalı.');
  if (yeni !== $('sYeni2').value) return ($('mHata').textContent = 'Yeni şifreler aynı değil.');
  const btn = $('sKaydet'); btn.disabled = true; btn.textContent = 'Değiştiriliyor…';
  try {
    await api('sifreDegistir', { eskiSifre: $('sEski').value, yeniSifre: yeni });
    modalKapat(); toast('Şifre değiştirildi.');
  } catch (e) {
    $('mHata').textContent = e.message; btn.disabled = false; btn.textContent = 'Şifreyi Değiştir';
  }
}

// ==================== MODAL / TOAST ====================
function modalAc(baslik, govde, alt, genis) {
  document.querySelector('.modal-ic').classList.toggle('genis', !!genis);
  $('modalBaslik').textContent = baslik;
  $('modalGovde').innerHTML = govde;
  $('modalAlt').innerHTML = alt || '';
  $('modal').hidden = false;
}
function modalKapat() { $('modal').hidden = true; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { modalKapat(); dahaKapat(); $('kulMenuKutu').hidden = true; } });

let toastZaman;
function toast(mesaj, hata) {
  const t = $('toast'); t.textContent = mesaj; t.className = hata ? 'hata' : ''; t.hidden = false;
  clearTimeout(toastZaman); toastZaman = setTimeout(() => t.hidden = true, 3200);
}

// ==================== PWA ====================
let yuklemeOlayi = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); yuklemeOlayi = e; $('yukleBtn').hidden = false; });
async function uygulamayiYukle() {
  $('kulMenuKutu').hidden = true;
  if (!yuklemeOlayi) return;
  yuklemeOlayi.prompt(); await yuklemeOlayi.userChoice; yuklemeOlayi = null; $('yukleBtn').hidden = true;
}
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

// ==================== BAŞLANGIÇ ====================
(async function baslat() {
  const kayit = ls.al('locus_oturum');
  if (!kayit || !kayit.token) return girisGoster();
  // Hızlı açılış: önce kayıtlı bilgiyle aç, arka planda oturumu doğrula
  D.token = kayit.token; D.kul = kayit.kul; D.sayfalar = VARSAYILAN_SAYFALAR;
  uygulamayiAc();
  try {
    const guncel = await api('ben');
    const degisti = JSON.stringify(guncel.yetkiler) !== JSON.stringify(D.kul.yetkiler);
    D.kul = guncel;
    ls.koy('locus_oturum', { token: D.token, kul: D.kul, sayfalar: D.sayfalar });
    if (degisti) { menuleriCiz(); rotaUygula(); }
  } catch (e) {
    if (e.kod === 'AG') toast('Çevrimdışı görünüyorsunuz. Bağlantı gelince veriler yenilenecek.', true);
  }
})();
